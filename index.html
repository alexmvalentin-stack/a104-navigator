<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A104 Navigator</title>
  <meta name="description" content="Opslagsværk til A104 Informationshåndtering: placering, koder, filnavne, BR18 og AB 18 – virker offline.">
  <meta name="theme-color" content="#0F2C4C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A104">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/icon-192.png" alt="" width="88" height="88">
    <h1>A104 Navigator</h1>
    <p id="splash-text">Starter…</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="splash-note">Første gang hentes ca. 20 MB. Derefter virker appen offline.</p>
  </div>

  <div id="app" hidden>
    <aside id="sidebar" aria-label="Menu">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="32" height="32">
        <div><b>A104 Navigator</b><span>A104 Informationshåndtering</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="side-btn" type="button"></button>
        <span id="version"></span>
      </div>
    </aside>
    <div id="scrim" hidden></div>

    <div id="main">
      <header id="topbar">
        <button id="menu-btn" class="icon-btn" type="button" aria-label="Åbn menu">☰</button>
        <div class="search-box">
          <span aria-hidden="true">🔍</span>
          <input id="global-search" type="search" autocomplete="off" enterkeyhint="search"
                 placeholder="Søg i A104 – fx brandstrategi, KS, referat, K01 eller C04.04" aria-label="Søg i A104">
        </div>
        <button id="where-btn" class="btn primary" type="button" title="Send teksten til Dokumentfinderen">
          <span class="wide-only">Hvor skal det ligge?</span><span class="narrow-only">Placér</span>
        </button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="ms.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
